name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatsApp-Notification-Simulator-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: WhatsApp Notification Simulator v1.0.0
          body: |
            ### 📱 WhatsApp Notification Simulator v1.0.0
            
            Simulate realistic WhatsApp notifications with custom sender names, custom messages, instant test trigger, and scheduled timers.
            
            **Features:**
            - 💬 Custom sender name & message content
            - ⏱️ Immediate test notification & customizable delay timer (5s, 10s, 30s, 1m, 5m)
            - 🟢 Authentic WhatsApp notification icon & styling
            - 🚀 Android 13+ & 14+ POST_NOTIFICATIONS permission support
            
            Download the APK below and install it on your Android device.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
