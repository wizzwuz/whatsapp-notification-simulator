name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notification-Simulator-v1.4.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: Notification Simulator v1.4.0
          body: |
            ### 📱 Notification Simulator v1.4.0
            
            Simulate native WhatsApp and Google Messages notifications with customizable senders, messages, instant test trigger, and scheduled timers.
            
            **What's New in v1.4.0:**
            - 📅 **Custom Date & Time Scheduling**: Schedule notifications for any exact date and time in the future using native DatePicker and TimePicker dialogs.
            - 🏷️ **Launcher App Name "NotifySim"**: App shows as `"NotifySim"` in the app drawer and home screen.
            - 💬 **Notification Header "Messages"**: System notifications clearly display `"Messages"` in the notification header.
            - 🌙 **Dark Mode**: Full DayNight theme support with instant Sun/Moon (☀️/🌙) toggle in the toolbar.
            - 📝 **Native Text Rendering**: Pure native Android notifications (`NotificationCompat.Builder`) without any image snapshot distortion.
            
            Download the APK below and install it on your Android device.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
