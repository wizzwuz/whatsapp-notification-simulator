name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notification-Simulator-v1.3.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: Notification Simulator v1.3.0
          body: |
            ### 📱 Notification Simulator v1.3.0
            
            Simulate native WhatsApp and Google Messages notifications with customizable senders, messages, instant test trigger, and scheduled timers.
            
            **What's New in v1.3.0:**
            - 📝 **Native Text Notifications**: Reverted custom RemoteViews to pure native Android notifications (`NotificationCompat.Builder`), ensuring crisp native text rendering without any image-snapshot artifacts.
            - 🏷️ **Notification Name "Messages"**: Changed app notification header label to `"Messages"`.
            - 🌙 **Dark Mode Support**: Full DayNight theme support with instant Sun/Moon (☀️/🌙) toggle in the toolbar.
            - 🧹 **Clean Interface**: Removed preset chips for a clean, uncluttered custom input experience.
            - 📱 **Interactive Preview**: Live notification mockup showing real-time updates as you type.
            
            Download the APK below and install it on your Android device.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
