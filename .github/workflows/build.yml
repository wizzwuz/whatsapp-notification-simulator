name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Notification-Simulator-v1.2.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: Notification Simulator v1.2.0
          body: |
            ### 📱 Notification Simulator v1.2.0
            
            Simulate authentic WhatsApp and Google Messages notifications with customizable senders, messages, instant test trigger, and scheduled timers.
            
            **What's New in v1.2.0:**
            - 🟢 **Authentic WhatsApp Notifications**: Custom RemoteViews and channels ensuring notifications clearly display `"WhatsApp"` with the WhatsApp icon and badge.
            - 🔵 **Authentic Messages Notifications**: Clearly displays `"Messages"` with the Google Messages icon and blue badge.
            - 🌙 **Dark Mode Support**: Full DayNight theme support with an instant ☀️/🌙 toggle in the toolbar (persists in preferences).
            - 🎨 **Modern Material 3 Design**: Live Notification Preview card that updates in real-time as you type, rounded squircle cards, and modern chips.
            
            Download the APK below and install it on your Android device.
          files: app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
